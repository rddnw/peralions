<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pera Lions</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pera Lions">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{
  --bg:#f4f4f4; --card:#ffffff; --ink:#111111; --ink2:#4a4a4a; --muted:#7a7a7a; --line:#e2e2e2; --surface:#fafafa;
  --black:#111111; --red:#e10600; --red-dark:#b40500; --on-red:#ffffff;
  --present:#1d7f45; --present-bg:#e4f3ea; --late:#a86a00; --late-bg:#fbefd6; --exc:#555555; --exc-bg:#ececec;
  --s-gym:#2b2b2b; --s-ground:#e10600; --card-glass:rgba(255,255,255,.86);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0c0c; --card:#171717; --ink:#f2f2f2; --ink2:#c4c4c4; --muted:#8c8c8c; --line:#2c2c2c; --surface:#121212;
    --red:#ff2a1f; --red-dark:#e10600;
    --present:#55c785; --present-bg:#16301f; --late:#e3a63a; --late-bg:#3a2c10; --exc:#bdbdbd; --exc-bg:#2a2a2a;
    --s-gym:#d6d6d6; --s-ground:#ff3b30; --card-glass:rgba(23,23,23,.86);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.display{font-family:Oswald,Impact,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em}
header.top{position:sticky;top:0;z-index:5;background:var(--black);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:3px solid var(--red)}
header .brand{display:flex;align-items:center;gap:10px;font-family:Oswald,Impact,sans-serif;font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase}
header .brand img{width:36px;height:36px;border-radius:8px;background:#fff}
header .brand img[src=""]{display:none}
/* Team logo watermark in the page background */
#bgLogo{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:no-repeat;background-position:center 58%;
  background-size:min(88vw,560px);opacity:.09;mix-blend-mode:multiply;background-image:url('logo.jpg')}
@media (prefers-color-scheme: dark){ #bgLogo{filter:grayscale(1) invert(1);mix-blend-mode:screen;opacity:.07} }
main{position:relative;z-index:1}
.card{background:var(--card-glass) !important;backdrop-filter:blur(1px)}
header .who{font-size:13px;display:flex;gap:8px;align-items:center}
header .who button{background:transparent;border:1px solid #666;color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
nav.tabs{display:flex;gap:4px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:55px;z-index:4;overflow-x:auto}
nav.tabs button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--ink2);padding:9px 12px;border-radius:8px;font:600 14px Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
nav.tabs button.on{background:var(--red);color:var(--on-red)}
main{max-width:860px;margin:0 auto;padding:14px 16px 96px}
h2{font:600 19px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:2px 0 10px}
h3{font:600 15px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:-1px}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1;min-width:0}
.row > .btn{flex:0 0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:active{background:var(--red-dark)}
.btn.dark{background:var(--black);border-color:var(--black);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%;margin-top:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
.seg button{flex:1;border:0;background:var(--surface);color:var(--ink2);padding:10px;font:600 14px Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.seg button.on{background:var(--black);color:#fff}
@media (prefers-color-scheme: dark){ .seg button.on{background:var(--red)} }
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--black);border-color:var(--black);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){ .chip.on{background:var(--red);border-color:var(--red)} }
.chip.static{cursor:default}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font:600 11px Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 7px;background:var(--s-gym);color:var(--card)}
.tag.ground{background:var(--red);color:#fff}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--present-bg);color:var(--present)}
.pill.pub{background:var(--late-bg);color:var(--late)}
.pill.gray{background:var(--exc-bg);color:var(--exc)}
.pill.red{background:var(--red);color:#fff}
.sess-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.sess{border-left:4px solid var(--s-gym)} .sess.ground{border-left-color:var(--red)}
.pre{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;margin-top:8px;font-size:14px}
.batch{margin-bottom:14px}
.batch-h{display:flex;justify-content:space-between;align-items:center;font:600 15px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:6px 2px;border-bottom:2px solid var(--black);margin-bottom:6px}
@media (prefers-color-scheme: dark){ .batch-h{border-bottom-color:var(--red)} }
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--card);cursor:pointer;user-select:none}
.prow .nm small{display:block;color:var(--muted);font-size:12px}
.prow .st{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--muted);min-width:70px;text-align:center}
.prow.Present{background:var(--present-bg);border-color:var(--present)} .prow.Present .st{background:var(--present);color:#fff}
.prow.Late{background:var(--late-bg);border-color:var(--late)} .prow.Late .st{background:var(--late);color:#fff}
.prow.Excused{background:var(--exc-bg);border-color:var(--exc)} .prow.Excused .st{background:var(--exc);color:var(--card)}
.sticky-bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--red);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:6}
.sticky-bar .count{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:10px;padding:12px}
.kpi .v{font:700 28px Oswald,sans-serif;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink2)}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.bar > i{display:block;height:100%;background:var(--red);border-radius:4px}
.band-High{color:var(--present);font-weight:700} .band-Medium{color:var(--late);font-weight:700} .band-Low{color:var(--red);font-weight:700}
.chart{width:100%;height:280px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal.hidden{display:none}
.modal-box{background:var(--card);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px;border-top:4px solid var(--red)}
@media(min-width:700px){.modal{align-items:center}.modal-box{border-radius:14px}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90%;border-left:4px solid var(--red)}
#toast.show{opacity:1} #toast.err{background:var(--red);border-left-color:var(--black)}
#loader{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--red);z-index:40;display:none;animation:ld 1s ease-in-out infinite alternate}
@keyframes ld{from{opacity:.3}to{opacity:1}}
.login{max-width:380px;margin:20px auto;text-align:center}
.login img{width:150px;height:150px;display:block;margin:0 auto 12px;border-radius:24px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.login .card{text-align:left}
.logrow,.loghead{display:grid;grid-template-columns:1.6fr .7fr .7fr .9fr .7fr;gap:6px}
.logrow{margin-bottom:6px} .logrow input{padding:8px 6px}
.loghead{font-size:11px;color:var(--muted);padding:0 2px}
.empty{color:var(--muted);text-align:center;padding:20px}
.right{text-align:right}
.note{font-size:12px;color:var(--muted);margin-top:2px}

/* v2 additions */
nav.tabs{top:calc(55px + env(safe-area-inset-top));padding:8px 8px;gap:2px}
nav.tabs button{padding:9px 8px;font-size:13px;letter-spacing:.03em}
.nbadge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--red);color:#fff;font:700 11px Inter,sans-serif;margin-left:6px;padding:0 5px;vertical-align:middle}
nav.tabs button.on .nbadge{background:#fff;color:var(--red)}
.alert-card{border-left:4px solid var(--red) !important}
.wa-card{text-align:left}
.kpi.warn{border-top-color:var(--late)}
.up{color:var(--present)} .down{color:var(--red)}
.chart.small{height:200px}
.vframe{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.actions .vframe{aspect-ratio:auto;background:none;width:auto;display:inline-flex}
.actions .vframe iframe{position:static;width:100%;height:200px}
.trow{padding:4px 0;border-bottom:1px solid var(--line)} .trow input{max-width:110px;flex:0 0 110px}
.unseen{border-left:4px solid var(--red) !important}
.test-card .grid3 b{font-size:16px}
</style>
</head>
<body>
<div id="loader"></div>
<div id="bgLogo"></div>
<header class="top">
  <div class="brand"><img src="logo.jpg" alt="" id="logoImg"><span id="brandName">Pera Lions</span></div>
  <div class="who" id="who"></div>
</header>
<nav class="tabs" id="tabs" style="display:none"></nav>
<main id="app"><div class="empty">Loading...</div></main>
<div id="toast"></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modal-box" id="modalBody"></div></div>

<script>
/* ================= State & helpers ================= */
const S = { user:null, token:null, data:null, pdata:null, pub:null, tab:null, form:null, att:null, ana:null,
            tests:null, videos:null, view:null, chartsReady:false };
const $ = s => document.querySelector(s);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE = 'peralions2_user';
function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

let loadingN = 0;
function loading(on){ loadingN += on ? 1 : -1; $('#loader').style.display = loadingN > 0 ? 'block' : 'none'; }
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', 2800); }

const API_URL = (window.PERA_API_URL || '').trim();
const MODE = new URLSearchParams(location.search).get('p') === 'admin' ? 'admin' : 'player';

async function api(fn, ...args){
  if(!API_URL || API_URL.indexOf('PASTE') >= 0){ toast('App not set up: put the Apps Script URL in config.js', true); throw new Error('NO_API'); }
  loading(true);
  try{
    const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ fn, args }) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Server error');
    return j.result;
  }catch(e){
    const m = (e && e.message) || String(e);
    if(m.indexOf('SESSION_EXPIRED') >= 0){ toast('Please log in again', true); doLogout(); }
    else if(/Failed to fetch|NetworkError|Load failed/.test(m)) toast('No connection - showing saved data', true);
    else if(m !== 'NO_API') toast(m.replace(/^Exception:\s*/, ''), true);
    throw e;
  }finally{ loading(false); }
}

function prettyDate(ymd){
  if(!ymd) return '';
  const [y,m,d] = String(ymd).slice(0,10).split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',timeZone:'UTC'});
}
function shortDate(ymd){ const [y,m,d] = String(ymd).slice(0,10).split('-').map(Number); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'UTC'}); }
function monthName(ym){ const [y,m] = ym.split('-').map(Number); return new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'}); }
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(ymd, n){ const [y,m,d] = ymd.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); }
function daysBetween(a, b){ const f = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d); }; return Math.round((f(b)-f(a))/864e5); }
const tag = t => `<span class="tag ${t==='Ground'?'ground':''}">${esc(t)}</span>`;
const splitAreas = s => String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const numSort = (a,b) => (isNaN(a)||isNaN(b)) ? String(a).localeCompare(String(b)) : Number(a)-Number(b);
const v = x => (x === null || x === undefined || x === '') ? '-' : x;
const team = () => (S.user && S.user.team) || (S.pub && S.pub.team) || 'Pera Lions';
function sign(x, suf){ if(x === null || x === undefined || x === '') return '-'; return (x > 0 ? '+' : '') + x + (suf || ''); }

function openModal(html){ $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }

/* ================= Copy / WhatsApp ================= */
function showMsg(title, text){
  S.msg = text;
  openModal(`<h2>${esc(title)}</h2>
    <textarea id="msgText" rows="12" readonly>${esc(text)}</textarea>
    <div class="actions">
      <button class="btn primary" onclick="copyMsg()">Copy message</button>
      <a class="btn dark" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Open WhatsApp</a>
      <button class="btn" onclick="closeModal()">Close</button>
    </div>`);
}
function copyText(txt, ta){
  const fallback = () => {
    let el = ta;
    if(!el){ el = document.createElement('textarea'); el.value = txt; document.body.appendChild(el); }
    el.removeAttribute('readonly'); el.select(); el.setSelectionRange(0, txt.length);
    let ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
    if(ta) ta.setAttribute('readonly',''); else el.remove();
    toast(ok ? 'Copied - paste it in WhatsApp' : 'Press and hold the text to copy', !ok);
  };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(()=>toast('Copied - paste it in WhatsApp'), fallback);
  else fallback();
}
function copyMsg(){ copyText(S.msg, $('#msgText')); }

/* ================= Start & public info ================= */
function start(){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  S.pub = store('peralions2_pub');
  const saved = store(STORE);
  if(saved && saved.token){ S.user = saved; S.token = saved.token; afterLogin(); }
  else renderLogin(MODE);
  loadPublic();
}
async function loadPublic(){
  try{
    S.pub = await api('getPublicInfo'); store('peralions2_pub', S.pub);
    if(!S.user && /login|signup/.test(S.screen || '')) (S.screen === 'signup' ? renderSignup() : renderLogin(S.loginKind));
  }catch(e){}
}
function waBlock(){
  const link = S.pub && S.pub.whatsAppGroupLink;
  if(!link) return '';
  return `<div class="card wa-card"><b>Are you in the ${esc(team())} WhatsApp group?</b>
    <p class="muted" style="margin:4px 0 8px">All session updates and attendance are posted there.</p>
    <a class="btn dark sm" href="${esc(link)}" target="_blank" rel="noopener">Join the WhatsApp group</a></div>`;
}

/* ================= Login / sign up / forgot ================= */
function authShell(inner){
  S.view = null;
  $('#tabs').style.display = 'none'; $('#who').innerHTML = '';
  $('#app').innerHTML = `<div class="login"><img src="logo.jpg" alt="Pera Lions logo">${inner}</div>`;
  window.scrollTo(0,0);
}

function renderLogin(kind){
  S.loginKind = kind || 'player'; S.screen = 'login';
  const player = S.loginKind === 'player';
  authShell(`<div class="card">
      <h2>${player ? 'Player login' : 'Captain / Admin login'}</h2>
      <div class="seg"><button class="${player?'on':''}" onclick="renderLogin('player')">Player</button><button class="${!player?'on':''}" onclick="renderLogin('admin')">Captain / Admin</button></div>
      ${player ? `<label>Mobile number</label><input id="lId" type="tel" inputmode="tel" placeholder="07XXXXXXXX" autocomplete="username">
        <label>Password</label><input id="lPw" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">`
      : `<label>Admin PIN</label><input id="lPw" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')doLogin()">`}
      <button class="btn primary block" onclick="doLogin()">Log in</button>
      ${player ? `<div class="actions" style="justify-content:space-between">
        <button class="btn sm" onclick="renderSignup()">Create account</button>
        <button class="btn sm" onclick="renderForgot()">Forgot password?</button></div>` : ''}
    </div>${player ? waBlock() : ''}`);
}

async function doLogin(){
  const id = $('#lId') ? $('#lId').value : '', pw = $('#lPw').value;
  const u = await api('login', S.loginKind, id, pw);
  setUser(u); afterLogin();
}
function setUser(u){ S.user = u; S.token = u.token; store(STORE, u); }

function renderSignup(){
  S.screen = 'signup';
  const batches = (S.pub && S.pub.batches) || ['22','23','24','25','26'];
  const link = S.pub && S.pub.whatsAppGroupLink;
  authShell(`<div class="card">
    <h2>Create your account</h2>
    <label>Full name</label><input id="suName" placeholder="e.g. Kasun Perera" autocomplete="name">
    <div class="grid2"><div><label>Batch</label><select id="suBatch"><option value="">Choose</option>${batches.map(b => `<option>${esc(b)}</option>`).join('')}</select></div>
    <div><label>Position (optional)</label><input id="suPos" placeholder="e.g. Flanker"></div></div>
    <label>Mobile number (you log in with this)</label><input id="suPhone" type="tel" inputmode="tel" placeholder="07XXXXXXXX">
    <label>Password (at least 6 characters)</label><input id="suPw" type="password" autocomplete="new-password">
    <label>Confirm password</label><input id="suPw2" type="password" autocomplete="new-password">
    <label>Are you in the ${esc(team())} WhatsApp group?</label>
    <div class="seg" id="suWa"><button data-v="yes" onclick="pickWa('yes')">Yes</button><button data-v="no" onclick="pickWa('no')">No</button></div>

function doLogout(){
  if(S.user) store(cacheKey(), null);

  renderLogin(S.loginKind || MODE);
}

/* ================= After login: saved data first, then fresh ================= */
const cacheKey = () => 'peralions2_cache_' + S.user.role + '_' + S.user.id;

async function afterLogin(){
  $('#brandName').textContent = team();
  $('#who').innerHTML = `<span>${esc(S.user.name)}</span><button onclick="doLogout()">Log out</button>`;
  if(S.user.role === 'player' && S.user.mustChange) return renderChangePw(true);
  const admin = S.user.role === 'admin';
  const cached = store(cacheKey());
  if(cached){
    if(admin) S.data = cached; else S.pdata = cached;
    setTab('home');
  } else $('#app').innerHTML = '<div class="empty">Loading...</div>';
  try{
    const fresh = await api(admin ? 'getAdminData' : 'getPlayerData', S.token);
    if(!S.user) return;
    if(admin) S.data = fresh; else S.pdata = fresh;
    if(!cached) setTab('home'); else refreshView();
  }catch(e){
    if(!cached && S.user) $('#app').innerHTML = '<div class="empty">Could not load. Check your connection and <a href="#" onclick="afterLogin();return false">try again</a>.</div>';
  }
}

function refreshView(){
  const el = document.activeElement;
  if(el && /INPUT|TEXTAREA|SELECT/.test(el.tagName)) { saveCache(); return; }
  if(S.tab === 'sessions') syncForm();
  if(['attend','analysis','tests'].indexOf(S.tab) >= 0 || S.view) { saveCache(); return; }
  render();
}
function saveCache(){
  if(!S.user) return;
  const d = S.user.role === 'admin' ? S.data : S.pdata;
  if(d) store(cacheKey(), d);
}

/* ================= Tabs ================= */
const ADMIN_TABS = [['home','Home'],['sessions','Sessions'],['players','Players'],['tests','Tests'],['videos','Videos'],['analysis','Analysis']];
const PLAYER_TABS = [['home','Home'],['train','Gym log'],['progress','Progress'],['videos','Videos'],['me','Me']];

function setTab(t){
  S.tab = t; S.view = null; S.drawCharts = null; window.scrollTo(0,0);
  const tabs = S.user.role === 'admin' ? ADMIN_TABS : PLAYER_TABS;
  const nav = $('#tabs');
  nav.style.display = t === 'attend' ? 'none' : 'flex';
  nav.innerHTML = tabs.map(([k,l]) => `<button class="${k===t?'on':''}" onclick="setTab('${k}')">${l}${badge(k)}</button>`).join('');
  render();
}
function badge(k){
  let n = 0;
  if(S.user.role === 'admin' && S.data){
    if(k === 'home') n = S.data.alerts.length + S.data.resets.length + S.data.players.filter(p => p.Status === 'Pending').length;
  } else if(S.pdata){
    if(k === 'videos') n = S.pdata.videos.filter(x => !x.watched).length;
  }
  return n ? `<span class="nbadge">${n}</span>` : '';
}
function render(){
  saveCache();
  if(S.view === 'progress') return renderProgressView();
  const admin = S.user.role === 'admin';
  const f = (admin ? { home:renderAdminHome, sessions:renderSessions, attend:renderAttend, players:renderPlayers,
                       tests:renderTests, videos:renderAdminVideos, analysis:renderAnalysis }
                   : { home:renderPlayerHome, train:renderLog, progress:renderMyProgress, videos:renderPlayerVideos, me:renderMe })[S.tab];
  f && f();
}

/* Google Charts is only downloaded the first time a chart is needed. */
function loadCharts(){
  if(S.chartsReady){ S.drawCharts && S.drawCharts(); return; }
  if(S.chartsLoading) return;
  S.chartsLoading = true;
  const sc = document.createElement('script');
  sc.src = 'https://www.gstatic.com/charts/loader.js';
  sc.onload = () => {
    google.charts.load('current', {packages:['corechart']});
    google.charts.setOnLoadCallback(() => { S.chartsReady = true; if(S.drawCharts) S.drawCharts(); });
  };
  document.head.appendChild(sc);
}
function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function baseOpts(){
  const ink = cssVar('--ink2'), line = cssVar('--line');
  return { backgroundColor:'transparent', legend:{ position:'top', textStyle:{ color:ink } },
    chartArea:{ left:44, right:12, top:36, bottom:40 }, fontName:'Inter',
    hAxis:{ textStyle:{ color:ink }, gridlines:{ color:'transparent' }, baselineColor:line },
    vAxis:{ textStyle:{ color:ink }, gridlines:{ color:line }, baselineColor:line, minValue:0 } };
}
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => S.drawCharts && S.chartsReady && S.drawCharts(), 250); });

function drawProgressCharts(P){
  if(!P || !window.google || !google.visualization) return;
  const el = id => document.getElementById(id);
  if(el('chMonths') && P.months.length){
    const d = google.visualization.arrayToDataTable([['Month','Attendance %',{role:'annotation'}]]
      .concat(P.months.map(m => [monthName(m.Month), m.Attendance || 0, m.Attendance === null ? '' : m.Attendance + '%'])));
    const o = baseOpts(); o.colors = [cssVar('--red')]; o.legend = { position:'none' }; o.vAxis.maxValue = 100; o.bar = { groupWidth:'50%' };
    new google.visualization.ColumnChart(el('chMonths')).draw(d, o);
  }
  P.tests.forEach((t, i) => {
    if(!el('chTest' + i)) return;
    const d = google.visualization.arrayToDataTable([['Date', t.Exercise + ' (' + t.Unit + ')']].concat(t.points.map(p => [shortDate(p.Date), p.Value])));
    const o = baseOpts(); o.colors = [cssVar('--red')]; o.legend = { position:'none' }; o.lineWidth = 2; o.pointSize = 8; delete o.vAxis.minValue;
    o.vAxis.direction = t.Better === 'Lower' ? -1 : 1; o.chartArea.top = 14;
    new google.visualization.LineChart(el('chTest' + i)).draw(d, o);
  });
  if(el('chLift') && P.lifts.length){
    const l = P.lifts.find(x => x.Exercise === S.liftEx) || P.lifts[0];
    const d = google.visualization.arrayToDataTable([['Date','Best kg']].concat(l.points.map(p => [shortDate(p.Date), p.Value])));
    const o = baseOpts(); o.colors = [cssVar('--s-gym')]; o.legend = { position:'none' }; o.lineWidth = 2; o.pointSize = 8; delete o.vAxis.minValue; o.chartArea.top = 14;
    new google.visualization.LineChart(el('chLift')).draw(d, o);
  }
}
function showProgress(P, adminView, backHtml){
  S.curProg = P;
  if(!S.liftEx && P.lifts.length) S.liftEx = P.lifts[0].Exercise;
  $('#app').innerHTML = (backHtml || '') + progressHtml(P, adminView);
  S.drawCharts = () => drawProgressCharts(P); loadCharts();
}

const CYCLE = ['', 'Present', 'Late', 'Excused'];
const LABEL = { '':'Absent', Present:'Present', Late:'Late', Excused:'Excused' };

async function openAttend(id){
  const r = await api('getSessionDetail', S.token, id);
  S.att = { session:r.session, map:r.attendance || {}, ratings:r.ratings, avail:r.availability || {}, feedback:r.feedback || [],
            focus:splitAreas(r.session.FocusAreas), rArea:null, pending:{} };
  setTab('attend');
}
function activePlayersByBatch(){
  const g = {};
  S.data.players.filter(p => p.Active).forEach(p => (g[p.Batch] = g[p.Batch] || []).push(p));
  return Object.keys(g).sort(numSort).map(b => [b, g[b].sort((x,y)=>x.Name.localeCompare(y.Name))]);
}
function availNote(pid){
  const a = S.att.avail[pid]; if(!a) return '';
  return a.Status === 'Going' ? 'Said: going' : 'Said: not going' + (a.Reason ? ' - ' + a.Reason : '');
}
function renderAttend(){
  const a = S.att, s = a.session;
  const areas = S.data.focusAreas.filter(x => x.Type === s.Type).map(x => x.Area);
  a.focus.forEach(x => { if(areas.indexOf(x) < 0) areas.push(x); });
  const groups = activePlayersByBatch();
  const notGoing = Object.keys(a.avail).filter(k => a.avail[k].Status === 'Not going').length;
  $('#app').innerHTML = `
    <button class="btn sm" onclick="setTab('sessions')">Back</button>
    <section class="card" style="margin-top:10px">
      <h2>${tag(s.Type)} ${prettyDate(s.Date)} ${esc(s.Time)}</h2>
      <label>What did you focus on? (update after the session)</label>
      <div class="chips">${areas.map(x => `<span class="chip ${a.focus.indexOf(x)>=0?'on':''}" data-a="${esc(x)}" onclick="toggleAFocus(this)">${esc(x)}</span>`).join('')}</div>
      <label>Notes (included in the WhatsApp message)</label>
      <input id="aNotes" value="${esc(s.Notes)}" placeholder="e.g. Good intensity, new lineout calls">
      ${notGoing ? `<div class="actions"><button class="btn sm" onclick="excuseUnavailable()">Mark the ${notGoing} who said "not going" as excused</button></div>` : ''}
    </section>
    <p class="muted">Tap a name to change: Absent, Present, Late, Excused.</p>
    ${groups.map(([b, ps]) => `<div class="batch">

    </div>`).join('') || '<div class="empty">No active players yet. Approve sign-ups on the Home tab.</div>'}
    <section class="card"><h3 style="margin-top:0">Captain ratings (optional)</h3>

function feedbackCard(){
  const fb = S.att.feedback; if(!fb.length) return '';
  const avg = k => { const xs = fb.map(f => Number(f[k])).filter(x => x > 0); return xs.length ? (xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(1) : '-'; };
  const name = pid => (S.data.players.find(p => p.PlayerID === pid) || {}).Name || pid;
  const comments = fb.filter(f => f.Comment);
  return `<section class="card"><h3 style="margin-top:0">Player feedback (${fb.length})</h3>
    <div class="grid3"><div class="kpi"><div class="v">${avg('RPE')}</div><div class="l">Avg effort (1-10)</div></div>

    <div class="kpi"><div class="v">${avg('Soreness')}</div><div class="l">Avg soreness (1-5)</div></div></div>
    ${comments.length ? `<table style="margin-top:8px">${comments.map(f => `<tr><td>${esc(name(f.PlayerID))}</td><td>${esc(f.Comment)}</td></tr>`).join('')}</table>` : ''}

function toggleAFocus(el){
  const x = el.dataset.a, f = S.att.focus, i = f.indexOf(x);
  i >= 0 ? f.splice(i,1) : f.push(x);
  el.classList.toggle('on'); renderRateBox();
}
function setStatus(pid, st){
  if(st) S.att.map[pid] = st; else delete S.att.map[pid];
  const el = document.getElementById('pr-' + pid);
  if(el){ el.className = 'prow ' + st; el.querySelector('.st').textContent = LABEL[st]; }
}
function cycle(pid){ const cur = S.att.map[pid] || ''; setStatus(pid, CYCLE[(CYCLE.indexOf(cur)+1) % CYCLE.length]); updateCounts(); }
function allPresent(b){
  const ps = S.data.players.filter(p => p.Active && p.Batch === b);
  const all = ps.every(p => S.att.map[p.PlayerID] === 'Present');
  ps.forEach(p => setStatus(p.PlayerID, all ? '' : 'Present'));
  updateCounts();
}
function excuseUnavailable(){
  Object.keys(S.att.avail).forEach(pid => { if(S.att.avail[pid].Status === 'Not going' && !S.att.map[pid]) setStatus(pid, 'Excused'); });
  updateCounts(); toast('Marked as excused');
}
function updateCounts(){
  const m = S.att.map; let here = 0;
  activePlayersByBatch().forEach(([b, ps]) => {
    const n = ps.filter(p => m[p.PlayerID] === 'Present' || m[p.PlayerID] === 'Late').length; here += n;
    const el = document.getElementById('bc-' + b); if(el) el.textContent = `(${n}/${ps.length})`;
  });
  $('#aCount').textContent = `${here} attended`;
  renderRateBox();
}

async function renderTests(){
  if(!S.tests){ $('#app').innerHTML = '<div class="empty">Loading tests...</div>'; S.tests = await api('getTests', S.token); }
  const T = S.tests, ex = T.exercises;
  if(!S.tEx || !ex.find(x => x.Exercise === S.tEx)) S.tEx = ex.length ? ex[0].Exercise : '';
  if(!S.tDate) S.tDate = S.data.today || todayStr();
  const meta = ex.find(x => x.Exercise === S.tEx) || { Unit:'kg', Better:'Higher' };
  const results = T.tests.filter(t => t.Exercise === S.tEx);
  const onDate = {}; results.filter(t => t.Date === S.tDate).forEach(t => onDate[t.PlayerID] = t.Value);
  const lastDate = ex.map(x => { const d = T.tests.filter(t => t.Exercise === x.Exercise).map(t => t.Date).sort().pop() || ''; return { x, d }; });
  const today = S.data.today || todayStr();
  // leaderboard: first / latest / best / change per active player
  const lower = meta.Better === 'Lower';
  const board = S.data.players.filter(p => p.Active).map(p => {
    const mine = results.filter(t => t.PlayerID === p.PlayerID);
    if(!mine.length) return null;
    const vals = mine.map(t => t.Value);
    const first = mine[0].Value, latest = mine[mine.length-1].Value;
    const best = lower ? Math.min.apply(null, vals) : Math.max.apply(null, vals);
    let ch = first > 0 && mine.length > 1 ? (latest - first) / first * 100 : null;
    if(ch !== null && lower) ch = -ch;
    return { p, first, latest, best, ch: ch === null ? null : Math.round(ch*10)/10, n: mine.length };
  }).filter(Boolean).sort((a,b) => lower ? a.latest - b.latest : b.latest - a.latest);
  $('#app').innerHTML = `
    <section class="card"><h2>Record test results</h2>
      <div class="grid2"><div><label>Test</label><select onchange="S.tEx=this.value;renderTests()">${ex.map(x => `<option ${x.Exercise===S.tEx?'selected':''}>${esc(x.Exercise)}</option>`).join('')}</select></div>
      <div><label>Test date</label><input type="date" value="${S.tDate}" onchange="S.tDate=this.value;renderTests()"></div></div>
      <p class="muted">Unit: ${esc(meta.Unit)} - ${lower ? 'lower is better' : 'higher is better'}. Leave a box empty if the player did not test.</p>
      ${activePlayersByBatch().map(([b, ps]) => `<div class="batch"><div class="batch-h"><span>${esc(b)} Batch</span></div>
        ${ps.map(p => `<div class="row trow"><span>${esc(p.Name)}</span><input class="tval" data-pid="${p.PlayerID}" type="number" step="0.5" inputmode="decimal" placeholder="${esc(meta.Unit)}" value="${onDate[p.PlayerID] !== undefined ? onDate[p.PlayerID] : ''}"></div>`).join('')}</div>`).join('') || '<p class="muted">No active players yet.</p>'}
      <button class="btn primary block" onclick="saveTestValues()">Save ${esc(S.tEx)} results</button>
    </section>
    <section class="card"><h2>${esc(S.tEx)} leaderboard</h2>
      ${board.length ? `<div class="tablewrap"><table><tr><th>#</th><th>Player</th><th class="n">First</th><th class="n">Latest</th><th class="n">Best</th><th class="n">Change</th></tr>
      ${board.map((r,i) => `<tr onclick="openPlayerProgress('${r.p.PlayerID}')" style="cursor:pointer"><td>${i+1}</td><td>${esc(r.p.Name)} <span class="muted">${esc(r.p.Batch)}</span></td>
        <td class="n">${r.first}</td><td class="n"><b>${r.latest}</b></td><td class="n">${r.best}</td><td class="n ${r.ch>0?'up':r.ch<0?'down':''}">${sign(r.ch,'%')}</td></tr>`).join('')}</table></div>`
      : '<p class="muted">No results yet for this test.</p>'}
    </section>
    <section class="card"><h2>Tests</h2>
      <table>${lastDate.map(({x,d}) => `<tr><td>${esc(x.Exercise)} <span class="muted">${esc(x.Unit)}, ${x.Better === 'Lower' ? 'lower' : 'higher'} is better</span></td>
        <td class="right">${d ? (daysBetween(d, today) > 30 ? `<span class="pill red">Due - last ${shortDate(d)}</span>` : `<span class="pill">Last ${shortDate(d)}</span>`) : '<span class="pill gray">Never tested</span>'}</td></tr>`).join('')}</table>
      <label>Add a test</label>
      <div class="row"><input id="ntName" placeholder="e.g. Hang clean"><select id="ntUnit" style="max-width:90px"><option>kg</option><option>reps</option><option>sec</option><option>m</option><option>cm</option></select>
      <select id="ntBetter" style="max-width:110px"><option value="Higher">Higher better</option><option value="Lower">Lower better</option></select></div>
      <button class="btn block" onclick="addTest()">Add test</button>
    </section>`;
}

  S.tests = await api('saveMaxTests', S.token, S.tDate, S.tEx, vals);

function embedUrl(u){
  let m = String(u).match(/(?:youtube\.com\/(?:watch\?[^#]*v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(m) return 'https://www.youtube.com/embed/' + m[1];
  m = String(u).match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
  return '';
}
function videoFrame(vd){
  const e = embedUrl(vd.URL);
  return e ? `<div class="vframe" id="vf-${vd.VideoID}"><button class="btn dark" onclick="playVideo('${vd.VideoID}')">Play video</button></div>`
           : `<a class="btn dark" href="${esc(vd.URL)}" target="_blank" rel="noopener">Open video</a>`;
}
function playVideo(id){
  const list = (S.user.role === 'admin' ? S.videos : S.pdata.videos) || [];
  const vd = list.find(x => x.VideoID === id); if(!vd) return;
  $('#vf-' + id).innerHTML = `<iframe src="${embedUrl(vd.URL)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
}

/* ---- Admin videos ---- */
async function renderAdminVideos(){
  if(!S.videos){ $('#app').innerHTML = '<div class="empty">Loading videos...</div>'; S.videos = await api('getVideos', S.token); }

  if(!S.vBatches) S.vBatches = [];
  $('#app').innerHTML = `
    <section class="card"><h2>Add a video</h2>
      <label>Title</label><input id="vTitle" placeholder="e.g. Ruck clean-out technique">
      <label>Link (YouTube or Google Drive)</label><input id="vUrl" placeholder="https://youtu.be/...">
      <div class="grid2"><div><label>Category</label><input id="vCat" placeholder="e.g. Tackling, Gym"></div>
      <div><label>For batches</label><div class="chips" id="vBatch">${S.data.batches.filter(b=>b.Active).map(b => `<span class="chip ${S.vBatches.indexOf(b.BatchCode)>=0?'on':''}" onclick="toggleVB(this,'${esc(b.BatchCode)}')">${esc(b.BatchCode)}</span>`).join('')}</div>
        <div class="note">None selected = everyone</div></div></div>
      <label>What should players look for? (optional)</label><textarea id="vDesc" rows="2"></textarea>
      <button class="btn primary block" onclick="addVideo()">Post video</button>
      <p class="note">For Google Drive videos, set sharing to "Anyone with the link can view".</p>
    </section>
    ${S.videos.map(vd => { const target = targetPlayers(vd, active); const seen = vd.views.filter(w => target.find(p => p.PlayerID === w.PlayerID)).length;
      return `<div class="card"><div class="sess-h"><b>${esc(vd.Title)}</b><span class="pill ${seen < target.length ? 'pub' : ''}">${seen}/${target.length} watched</span></div>
      <div class="muted">${vd.Category ? esc(vd.Category) + ' - ' : ''}${vd.Batches ? 'Batches ' + esc(vd.Batches) : 'Everyone'} - posted ${shortDate(vd.Created)}</div>
      ${vd.Description ? `<p style="margin:6px 0">${esc(vd.Description)}</p>` : ''}
      <div class="bar"><i style="width:${target.length ? Math.round(seen/target.length*100) : 0}%"></i></div>
      <div class="actions"><button class="btn sm primary" onclick="videoDetail('${vd.VideoID}')">Who watched</button>${videoFrame(vd)}<button class="btn sm danger" onclick="delVideo('${vd.VideoID}')">Delete</button></div></div>`; }).join('') || '<div class="empty">No videos yet.</div>'}`;
}
function targetPlayers(vd, active){ const b = splitAreas(vd.Batches); return active.filter(p => !b.length || b.indexOf(p.Batch) >= 0); }
function toggleVB(el, b){ const i = S.vBatches.indexOf(b); i >= 0 ? S.vBatches.splice(i,1) : S.vBatches.push(b); el.classList.toggle('on'); }
async function addVideo(){
  S.videos = await api('saveVideo', S.token, { Title:$('#vTitle').value, URL:$('#vUrl').value, Category:$('#vCat').value, Description:$('#vDesc').value, Batches:S.vBatches });
  S.vBatches = []; renderAdminVideos(); toast('Video posted');
  showMsg('Tell the players', `*${team().toUpperCase()} - NEW VIDEO*\n${S.videos[0].Title}\nWatch it in the app and tap "Mark as watched": ${S.data.appUrl}`);
}
async function delVideo(id){ if(!confirm('Delete this video and its watch records?')) return; S.videos = await api('deleteVideo', S.token, id); renderAdminVideos(); }
function videoDetail(id){
  const vd = S.videos.find(x => x.VideoID === id);
  const target = targetPlayers(vd, S.data.players.filter(p => p.Active));
  const seen = {}; vd.views.forEach(w => seen[w.PlayerID] = w.Timestamp);
  const yes = target.filter(p => seen[p.PlayerID]), no = target.filter(p => !seen[p.PlayerID]);
  S.vRemind = `*${team().toUpperCase()} - PLEASE WATCH*\n"${vd.Title}"\n\nNot watched yet:\n` + no.map((p,i) => `${i+1}. ${p.Name} (${p.Batch})`).join('\n') + `\n\nWatch in the app and tap "Mark as watched": ${S.data.appUrl}`;
  openModal(`<h2>${esc(vd.Title)}</h2>
    <div class="grid2"><div><h3>Watched (${yes.length})</h3>${yes.map(p => `<div>${esc(p.Name)} <span class="note">${shortDate(seen[p.PlayerID])}</span></div>`).join('') || '<p class="muted">Nobody yet</p>'}</div>
    <div><h3>Not watched (${no.length})</h3>${no.map(p => `<div>${esc(p.Name)} <span class="muted">${esc(p.Batch)}</span></div>`).join('') || '<p class="muted">Everyone watched</p>'}</div></div>
    <div class="actions">${no.length ? `<button class="btn primary" onclick="showMsg('Reminder', S.vRemind)">Reminder message</button>` : ''}<button class="btn" onclick="closeModal()">Close</button></div>`);
}

function renderAnalysis(){
  const today = S.data.today || todayStr();
  const season = S.data.settings.SeasonStart || '';
  if(!S.anaRange){ const f = addDays(today, -90); S.anaRange = { from: f > season ? f : season, to: today }; }
  const A = S.ana;
  $('#app').innerHTML = `
    <section class="card"><div class="grid2">
      <div><label>From</label><input type="date" id="anFrom" value="${S.anaRange.from}"></div>
      <div><label>To</label><input type="date" id="anTo" value="${S.anaRange.to}"></div></div>
      <div class="actions">
        <button class="btn sm" onclick="anaPreset('season')">This season</button>
        ${[30,90].map(n => `<button class="btn sm" onclick="anaPreset(${n})">Last ${n} days</button>`).join('')}
        <button class="btn primary" onclick="runAnalysis()">Analyse</button>
        ${A ? '<button class="btn" onclick="summaryMsg()">WhatsApp summary</button><button class="btn" onclick="exportAna()">Export to sheet</button>' : ''}
      </div></section>
    <div>${A ? anaHtml(A) : '<div class="empty">Choose a period and tap Analyse.</div>'}</div>`;
  if(A){ S.drawCharts = () => drawAnaCharts(A); loadCharts(); }
}
function anaPreset(n){
  const t = S.data.today || todayStr();
  S.anaRange = n === 'season' ? { from: S.data.settings.SeasonStart || addDays(t,-90), to: t } : { from:addDays(t,-n), to:t };
  runAnalysis();
}
async function runAnalysis(){
  if($('#anFrom')) S.anaRange = { from:$('#anFrom').value, to:$('#anTo').value };
  S.ana = await api('getAnalysis', S.token, S.anaRange.from, S.anaRange.to); render();
}
async function exportAna(){
  const url = await api('exportAnalysis', S.token, S.anaRange.from, S.anaRange.to);
  toast('Exported to the Analysis tab'); window.open(url, '_blank');
}
function summaryMsg(){
  const A = S.ana, T = A.totals;
  const top = A.players.filter(p => p.Attendance !== null).slice(0, 5);
  const improved = A.players.filter(p => p.TestChange !== null).sort((a,b) => b.TestChange - a.TestChange).slice(0, 3);
  const low = A.players.filter(p => p.Band === 'Low');
  const L = [`*${team().toUpperCase()} - ATTENDANCE SUMMARY*`, `Period: ${prettyDate(A.from)} to ${prettyDate(A.to)}`,
    `Sessions: ${T.Sessions} (${T.Gym} gym, ${T.Ground} ground)`, `Average attendance: ${v(T.AvgAttendance)}%`, '', '*Top attendance*'];
  top.forEach((p, i) => L.push(`${i+1}. ${p.Name} (${p.Batch}) - ${p.Attendance}%`));
  if(improved.length){ L.push('', '*Most improved in max tests*'); improved.forEach((p, i) => L.push(`${i+1}. ${p.Name} (${p.Batch}) ${sign(p.TestChange,'%')}`)); }
  L.push('', '*By batch*');
  A.batches.forEach(b => L.push(`${b.Batch} Batch: ${v(b.Attendance)}%`));
  if(low.length){ L.push('', `*Below ${A.weights.low}% - please talk to the captain*`); low.forEach(p => L.push(`${p.Name} (${p.Batch}) - ${v(p.Attendance)}%`)); }
  showMsg('Summary message', L.join('\n'));
}
function anaHtml(A){
  const T = A.totals;
  const bandRow = b => `<tr><td class="band-${b.Band}">${b.Band}</td><td>${b.Range}</td><td class="n">${b.Players}</td>
    <td class="n">${v(b.AvgAttendance)}%</td><td class="n"><b>${v(b.AvgFocusScore)}</b></td><td class="n">${sign(b.AvgTestChange, '%')}</td>
    <td class="n">${sign(b.AvgRatingChange)}</td><td class="n">${sign(b.AvgStrengthChange, '%')}</td></tr>`;
  return `
    <div class="kpis">
      <div class="kpi"><div class="v">${T.Sessions}</div><div class="l">Sessions (${T.Gym} gym, ${T.Ground} ground)</div></div>
      <div class="kpi"><div class="v">${v(T.AvgAttendance)}%</div><div class="l">Average attendance</div></div>
      <div class="kpi"><div class="v">${T.Players}</div><div class="l">Active players</div></div>
    </div>
    <section class="card"><h2>Attendance bands - does turning up pay off?</h2>
      <p class="muted">Focus score = ${Math.round(A.weights.participation*100)}% participation + ${Math.round(A.weights.rating*100)}% captain rating. Max test change = first to latest test in the period (positive = better). Rating and gym-log changes compare the first and second half of the period.</p>
      <div class="tablewrap"><table><tr><th>Band</th><th>Attendance</th><th class="n">Players</th><th class="n">Avg att.</th><th class="n">Focus</th><th class="n">Max test chg</th><th class="n">Rating chg</th><th class="n">Lift chg</th></tr>
      ${A.bands.map(bandRow).join('')}</table></div>
      <div id="chBands" class="chart"></div>
      <p class="muted">${insight(A)}</p>
    </section>
    <section class="card"><h2>Weekly attendance %</h2><div id="chWeekly" class="chart"></div></section>
    <section class="card"><h2>Focus areas</h2>
      <div class="tablewrap"><table><tr><th>Area</th><th>Type</th><th class="n">Sessions</th><th class="n">Avg particip.</th><th class="n">High</th><th class="n">Medium</th><th class="n">Low</th></tr>
      ${A.areas.map(a => `<tr><td>${esc(a.Area)}</td><td>${tag(a.Type)}</td><td class="n">${a.Sessions}</td><td class="n">${v(a.AvgParticipation)}%</td>
        <td class="n">${v(a.HighScore)}</td><td class="n">${v(a.MediumScore)}</td><td class="n">${v(a.LowScore)}</td></tr>`).join('')}</table></div>
    </section>
    <section class="card"><h2>By batch</h2>
      <div class="tablewrap"><table><tr><th>Batch</th><th class="n">Players</th><th class="n">Attendance</th><th class="n">Gym</th><th class="n">Ground</th></tr>
      ${A.batches.map(b => `<tr><td>${esc(b.Batch)}</td><td class="n">${b.Players}</td><td class="n">${v(b.Attendance)}%</td><td class="n">${v(b.Gym)}%</td><td class="n">${v(b.Ground)}%</td></tr>`).join('')}</table></div>
    </section>
    <section class="card"><h2>Players</h2><p class="muted">Tap a player for their full progress.</p>
      <div class="tablewrap"><table><tr><th>Name</th><th>Batch</th><th class="n">Att.</th><th class="n">Focus</th><th class="n">Max test chg</th><th class="n">Rating chg</th><th class="n">Lift chg</th><th>Band</th></tr>
      ${A.players.map(p => `<tr onclick="openPlayerProgress('${p.PlayerID}')" style="cursor:pointer"><td>${esc(p.Name)}</td><td>${esc(p.Batch)}</td>
        <td class="n">${v(p.Attendance)}%</td><td class="n"><b>${v(p.FocusScore)}</b></td><td class="n">${sign(p.TestChange,'%')}</td>
        <td class="n">${sign(p.RatingChange)}</td><td class="n">${sign(p.StrengthChange,'%')}</td><td class="band-${p.Band}">${p.Band}</td></tr>`).join('')}</table></div>
    </section>`;
}
function insight(A){
  const h = A.bands[0], l = A.bands[2];
  if(!h.Players || !l.Players || h.AvgFocusScore === null || l.AvgFocusScore === null) return 'Need players in both the High and Low bands for a comparison.';
  let s = `High-attendance players average a focus score of <b>${h.AvgFocusScore}</b> vs <b>${l.AvgFocusScore}</b> for low-attendance players`;
  if(h.AvgTestChange !== null && l.AvgTestChange !== null) s += `; their max tests improved ${sign(h.AvgTestChange,'%')} vs ${sign(l.AvgTestChange,'%')}`;
  if(h.AvgRatingChange !== null && l.AvgRatingChange !== null) s += `; captain ratings changed ${sign(h.AvgRatingChange)} vs ${sign(l.AvgRatingChange)}`;
  return s + '.';
}
function drawAnaCharts(A){
  if(!window.google || !google.visualization) return;
  const gym = cssVar('--s-gym'), ground = cssVar('--s-ground'), red = cssVar('--red');
  const el = id => document.getElementById(id);
  if(el('chBands')){
    const d = google.visualization.arrayToDataTable([['Band','Avg focus score',{role:'annotation'}]]
      .concat(A.bands.map(b => [b.Band + ' (' + b.Players + ')', b.AvgFocusScore || 0, b.AvgFocusScore === null ? '' : String(b.AvgFocusScore)])));
    const o = baseOpts(); o.colors = [red]; o.legend = { position:'none' }; o.bar = { groupWidth:'45%' }; o.vAxis.maxValue = 100;
    o.title = 'Average focus score by attendance band'; o.titleTextStyle = { color:cssVar('--ink'), fontSize:13 };
    new google.visualization.ColumnChart(el('chBands')).draw(d, o);
  }
  if(el('chWeekly') && A.weekly.length){
    const d = google.visualization.arrayToDataTable([['Week','Gym %','Ground %']].concat(A.weekly.map(w => [shortDate(w.Week), w.Gym, w.Ground])));
    const o = baseOpts(); o.colors = [gym, ground]; o.lineWidth = 2; o.pointSize = 8; o.vAxis.maxValue = 100; o.interpolateNulls = true; o.focusTarget = 'category';
    new google.visualization.LineChart(el('chWeekly')).draw(d, o);
  }
}

async function setAvail(id, status){
  let reason = '';

  S.pdata = await api('setAvailability', S.token, id, status, reason); render(); toast('Thanks - the captain can see this');
}
function openFeedback(id){
  const s = S.pdata.recent.find(x => x.SessionID === id);
  const sel = (id, lo, hi) => `<select id="${id}"><option value="">-</option>${Array.from({length:hi-lo+1},(_,i)=>lo+i).map(k=>`<option>${k}</option>`).join('')}</select>`;
  openModal(`<h2>Feedback: ${esc(s.Type)} ${prettyDate(s.Date)}</h2>
    <label>How hard was it? (1 very easy - 10 maximum effort)</label>${sel('fbRPE',1,10)}
    <div class="grid2"><div><label>Energy (1 low - 5 high)</label>${sel('fbEnergy',1,5)}</div>
    <div><label>Soreness (1 none - 5 very sore)</label>${sel('fbSore',1,5)}</div></div>
    <label>Anything to tell the captain? (niggles, injuries, what you learned)</label><textarea id="fbComment" rows="3"></textarea>
    <div class="actions"><button class="btn primary" onclick="sendFeedback('${id}')">Submit</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}
async function sendFeedback(id){
  S.pdata = await api('saveFeedback', S.token, id, { RPE:$('#fbRPE').value, Energy:$('#fbEnergy').value, Soreness:$('#fbSore').value, Comment:$('#fbComment').value });
  closeModal(); render(); toast('Feedback saved');
}

/* =========================================================
   PLAYER - Gym log (draft auto-saved on the phone)
   ========================================================= */
const DRAFT = 'peralions2_draft';
function blankRow(){ return { Exercise:'', Sets:'', Reps:'', Weight:'', RPE:'' }; }
function renderLog(){
  const d = S.pdata;
  let draft = store(DRAFT);
  if(!draft || draft.pid !== d.me.id) draft = { pid:d.me.id, rows:[blankRow(), blankRow(), blankRow()], notes:'' };
  if(S.logSession !== undefined){ draft.session = S.logSession; delete S.logSession; }
  if(draft.session === undefined) draft.session = (d.gymSessions.find(s => s.Date === d.today) || {}).SessionID || '';
  S.draft = draft; store(DRAFT, draft);
  const sess = d.gymSessions.find(s => s.SessionID === draft.session);
  const byDate = {};
  d.logs.forEach(l => (byDate[l.Timestamp.slice(0,10)] = byDate[l.Timestamp.slice(0,10)] || []).push(l));
  $('#app').innerHTML = `
    <section class="card"><h2>Log gym work</h2>
      <label>Session</label>
      <select onchange="S.draft.session=this.value;saveDraft();renderLog()">
        <option value="">Own workout (not a team session)</option>
        ${d.gymSessions.map(s => `<option value="${s.SessionID}" ${s.SessionID===draft.session?'selected':''}>${prettyDate(s.Date)} ${esc(s.Time)} - ${esc(s.FocusAreas||'Gym')}</option>`).join('')}
      </select>
      ${sess && sess.Plan ? `<div class="pre">${esc(sess.Plan)}</div>` : ''}
      <p class="muted">Fill it in during the session. It is saved on your phone until you submit.</p>
      <div class="loghead"><span>Exercise</span><span>Sets</span><span>Reps</span><span>Kg</span><span>RPE</span></div>
      <datalist id="exList">${d.exercises.map(e => `<option value="${esc(e)}">`).join('')}</datalist>
      <div>${draft.rows.map((r,i) => `<div class="logrow">
        <input list="exList" placeholder="Exercise" value="${esc(r.Exercise)}" oninput="dr(${i},'Exercise',this.value)">
        <input inputmode="numeric" value="${esc(r.Sets)}" oninput="dr(${i},'Sets',this.value)">
        <input inputmode="numeric" value="${esc(r.Reps)}" oninput="dr(${i},'Reps',this.value)">
        <input inputmode="decimal" value="${esc(r.Weight)}" oninput="dr(${i},'Weight',this.value)">
        <input inputmode="numeric" placeholder="1-10" value="${esc(r.RPE)}" oninput="dr(${i},'RPE',this.value)"></div>`).join('')}</div>
      <button class="btn sm" onclick="S.draft.rows.push(blankRow());saveDraft();renderLog()">Add exercise</button>
      <label>Notes (how did it feel?)</label><input value="${esc(draft.notes)}" oninput="S.draft.notes=this.value;saveDraft()">
      <button class="btn primary block" onclick="submitLog()">Submit workout</button>
      <p class="muted">RPE = how hard the set felt (1 easy, 10 maximum effort).</p>
    </section>
    <h3>My recent logs</h3>
    ${Object.keys(byDate).slice(0, 15).map(dt => `<div class="card"><b>${prettyDate(dt)}</b><table>
      ${byDate[dt].map(l => `<tr><td>${esc(l.Exercise)}</td><td class="n">${v(l.Sets)} x ${v(l.Reps)}</td><td class="n">${v(l.Weight)} kg</td><td class="n">RPE ${v(l.RPE)}</td>
      <td class="right"><button class="btn sm danger" onclick="delLog('${esc(l.LogID)}')">Delete</button></td></tr>`).join('')}</table></div>`).join('') || '<div class="empty">No logs yet.</div>'}`;
}
function saveDraft(){ store(DRAFT, S.draft); }
function dr(i, k, val){ S.draft.rows[i][k] = val; saveDraft(); }
async function submitLog(){
  const rows = S.draft.rows.filter(r => r.Exercise.trim()).map(r => Object.assign({}, r, { Notes:S.draft.notes }));
  if(!rows.length) return toast('Add at least one exercise', true);
  S.pdata = await api('saveGymLogs', S.token, S.draft.session, rows);
  store(DRAFT, null); renderLog(); toast('Workout saved');
}
async function delLog(id){ if(!confirm('Delete this entry?')) return; S.pdata = await api('deleteGymLog', S.token, id); renderLog(); }

/* =========================================================
   PLAYER - Progress & Me
   ========================================================= */
function renderMyProgress(){ showProgress(S.pdata.progress, false); }

function renderMe(){
  const d = S.pdata, me = d.me;
  $('#app').innerHTML = `
    <section class="card"><h2>My profile</h2>
      <table><tr><td class="muted">Name</td><td>${esc(me.name)}</td></tr>
      <tr><td class="muted">Batch</td><td>${esc(me.batch)}</td></tr>
      ${me.position ? `<tr><td class="muted">Position</td><td>${esc(me.position)}</td></tr>` : ''}
      <tr><td class="muted">Mobile (login)</td><td>${esc(me.phone)}</td></tr>
      <tr><td class="muted">Member since</td><td>${me.joined ? prettyDate(me.joined) : '-'}</td></tr></table>
      <p class="note">To change your name, batch or number, ask the captain.</p>
    </section>
    ${d.settings.WhatsAppGroupLink ? `<section class="card"><h2>WhatsApp group</h2><a class="btn dark" href="${esc(d.settings.WhatsAppGroupLink)}" target="_blank" rel="noopener">Open the ${esc(team())} group</a></section>` : ''}
    ${renderChangePw(false)}
    <button class="btn block" onclick="doLogout()">Log out</button>`;
}

start();
</script>
</body>
</html>
